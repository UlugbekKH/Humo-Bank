<style>
:root{
  --ink:#0F2A43;
  --bg:#F3F6F8;
  --surface:#FFFFFF;
  --text:#14212E;
  --muted:#58687A;
  --line:#D5DDE3;
  --saffron:#F2A900;
  --saffron-ink:#2B1D00;
  --serif:'Noto Serif','PT Serif',Georgia,serif;
  --sans:'Noto Sans','PT Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#0A1827;
    --bg:#0C1A29;
    --surface:#13273B;
    --text:#E8EEF3;
    --muted:#9DB0C2;
    --line:#26405A;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;font-size:16px}
a{color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- Hero band (always dark blue) ---------- */
.band{background:var(--ink);color:#fff}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;flex-wrap:wrap}
.who{display:flex;flex-direction:column;line-height:1.25}
.who strong{font-family:var(--serif);font-size:1.05rem}
.who span{font-size:.85rem;color:#B7C6D6}
.nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:.95rem;color:#D6E0EA}
.nav a:hover{color:#fff;text-decoration:underline}
.lang{display:flex;border:1px solid #3A5875;border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-size:.85rem;font-weight:600;background:transparent;color:#D6E0EA;border:0;padding:6px 12px;cursor:pointer}
.lang button+button{border-left:1px solid #3A5875}
.lang button[aria-pressed="true"]{background:var(--saffron);color:var(--saffron-ink)}

.hero{display:grid;gap:36px;padding:40px 0 56px;align-items:start}
@media (min-width:920px){.hero{grid-template-columns:1fr 480px;gap:56px;padding:64px 0 72px}}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.12;letter-spacing:-.01em;max-width:14em}
.hero p{margin-top:20px;font-size:1.1rem;color:#C9D6E3;max-width:34em}
.btn{display:inline-block;margin-top:28px;background:var(--saffron);color:var(--saffron-ink);font-weight:600;text-decoration:none;padding:13px 24px;border-radius:8px}
.btn:hover{filter:brightness(1.06)}

/* ---------- Calculator ---------- */
.calc{background:var(--surface);color:var(--text);border-radius:14px;padding:24px;border:1px solid var(--line)}
.calc h2{font-family:var(--serif);font-size:1.3rem;margin-bottom:18px}
.field{margin-bottom:18px}
.field label{display:block;font-size:.9rem;font-weight:500;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.val{font-weight:600;font-variant-numeric:tabular-nums}
select,input[type=number]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input[type=range]{width:100%;accent-color:var(--saffron);margin-top:8px}
.result{margin-top:6px;padding-top:18px;border-top:1px solid var(--line)}
.result .big-l{font-size:.9rem;color:var(--muted)}
.result .big{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,6vw,2.5rem);line-height:1.2;font-variant-numeric:tabular-nums}
.result .big small{font-family:var(--sans);font-size:1rem;font-weight:500;color:var(--muted)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.mini div span{display:block;font-size:.82rem;color:var(--muted)}
.mini div b{font-variant-numeric:tabular-nums}
.deposit{margin-top:16px;padding:12px 14px;border-left:3px solid var(--saffron);background:var(--bg);border-radius:0 8px 8px 0;font-size:.9rem}
.deposit b{font-variant-numeric:tabular-nums}
.note{margin-top:14px;font-size:.8rem;color:var(--muted)}

/* ---------- Schedule (always visible) ---------- */
.schedule{padding-top:48px}
.schedule h2,section.block h2{font-family:var(--serif);font-size:clamp(1.6rem,3.6vw,2.2rem);margin-bottom:20px}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{color:var(--muted);font-weight:500;background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0;background:var(--bg)}

/* ---------- Sections ---------- */
section.block{padding:64px 0 0}
.terms{list-style:none;border-top:1px solid var(--line)}
.terms li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid var(--line)}
.terms .l{color:var(--muted);font-size:1rem}
.terms .l small{display:block;font-size:.85rem}
.terms .v{font-family:var(--serif);font-weight:700;font-size:clamp(1.3rem,3.4vw,1.8rem)}

.steps{list-style:none;display:grid;gap:28px;counter-reset:s}
@media (min-width:820px){.steps{grid-template-columns:repeat(3,1fr);gap:36px}}
.steps li{counter-increment:s;border-top:3px solid var(--saffron);padding-top:14px}
.steps li::before{content:counter(s);font-family:var(--serif);font-weight:700;font-size:1.6rem;display:block}
.steps h3{font-size:1.1rem;margin:4px 0 6px}
.steps p{color:var(--muted)}

.contacts{display:grid;gap:12px;max-width:560px}
.contacts .c{display:flex;justify-content:space-between;gap:16px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.contacts a.c:hover{border-color:var(--saffron)}
.contacts .c span{color:var(--muted)}
.contacts .c b{font-weight:600;text-align:right}
.lead{color:var(--muted);margin-bottom:20px;max-width:36em}

footer{margin-top:72px;border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:.85rem}
</style>
</head>

const amountRange = $("amountRange"), amountNum = $("amountNum"), termRange = $("termRange"), ptype = $("ptype");

amountRange.min = CONFIG.amount.min; amountRange.max = CONFIG.amount.max; amountRange.step = CONFIG.amount.step;
amountRange.value = CONFIG.amount.def; amountNum.value = CONFIG.amount.def;
termRange.min = CONFIG.term.min; termRange.max = CONFIG.term.max; termRange.step = 1; termRange.value = CONFIG.term.def;

function clampAmount(v) {
  v = Number(v) || CONFIG.amount.min;
  return Math.min(CONFIG.amount.max, Math.max(CONFIG.amount.min, v));
}

function calculate() {
  const P = clampAmount(amountNum.value);
  const n = Number(termRange.value);
  const r = CONFIG.rateMonthly / 100;
  const rows = [];
  let bal = P;

  if (ptype.value === "ann") {
    const pmt = P * r / (1 - Math.pow(1 + r, -n));
    for (let i = 1; i <= n; i++) {
      const interest = bal * r, principal = pmt - interest;
      bal = Math.max(0, bal - principal);
      rows.push({ i, principal, interest, pay: pmt, bal });
    }
  } else {
    const principal = P / n;
    for (let i = 1; i <= n; i++) {
      const interest = bal * r;
      bal = Math.max(0, bal - principal);
      rows.push({ i, principal, interest, pay: principal + interest, bal });
    }
  }

  const total = rows.reduce((s, x) => s + x.pay, 0);
  const interestSum = rows.reduce((s, x) => s + x.interest, 0);
  const cur = t("cur");

  $("amountOut").textContent = fmtInt(P) + " " + cur;
  $("termOut").textContent = n + " " + t("unit_month");
  $("payLabel").textContent = ptype.value === "ann" ? t("r_monthly") : t("r_first");
  $("payOut").innerHTML = fmt(rows[0].pay) + " <small>" + cur + "</small>";
  $("totalOut").textContent = fmt(total) + " " + cur;
  $("overOut").textContent = fmt(total - P) + " " + cur;
  $("depOut").textContent = fmt(P * CONFIG.depositPct / 100) + " " + cur;

  $("sched").innerHTML = rows.map(x =>
    "<tr><td>" + x.i + "</td><td>" + fmt(x.principal) + "</td><td>" + fmt(x.interest) +
    "</td><td>" + fmt(x.pay) + "</td><td>" + fmt(x.bal) + "</td></tr>").join("");
  $("schedFoot").innerHTML =
    "<tr><td>" + t("th_total") + "</td><td>" + fmt(P) + "</td><td>" + fmt(interestSum) +
    "</td><td>" + fmt(total) + "</td><td></td></tr>";
}

function applyLang() {
  document.documentElement.lang = lang === "tj" ? "tg" : lang;
  document.title = t("meta_title");
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll("[data-lang]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"));
  calculate();
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch (e) {}
  applyLang();
}));

amountRange.addEventListener("input", () => { amountNum.value = amountRange.value; calculate(); });
amountNum.addEventListener("input", () => { amountRange.value = clampAmount(amountNum.value); calculate(); });
amountNum.addEventListener("change", () => { amountNum.value = clampAmount(amountNum.value); amountRange.value = amountNum.value; calculate(); });
termRange.addEventListener("input", calculate);
ptype.addEventListener("change", calculate);

// Contacts
$("phoneText").textContent = CONFIG.phone;
$("phoneLink").href = "tel:+" + CONFIG.phoneDigits;
$("waText").textContent = CONFIG.phone;
$("waLink").href = "https://wa.me/" + CONFIG.phoneDigits;
$("tgText").textContent = "@" + CONFIG.telegram;
$("tgLink").href = "https://t.me/" + CONFIG.telegram;

applyLang();
</script>
</body>
</html>
